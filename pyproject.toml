[project]
name = "flexibilizar-brand"
version = "0.1.0"
description = "Logo, banner and intro for the YouTube channel Flexibilizar"
requires-python = ">=3.11"
dependencies = ["pillow>=10", "numpy>=1.26", "fonttools>=4.40", "brotli>=1.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
